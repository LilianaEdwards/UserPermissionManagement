
name: CI - Build and Test

on:
  push:
    branches:
      - master
      - 'feature/**'

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Repository Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print success message
        run: echo "GitHub Actions workflow executed successfully!"

  backend-build:
    name: Build and Test ASP.NET Core Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet dependencies
        run: dotnet restore UserPermissionManagement.slnx

      - name: Build solution
        run: dotnet build UserPermissionManagement.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test UserPermissionManagement.slnx --configuration Release --no-build --no-restore
